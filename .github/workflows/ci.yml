name: CI

on:
  push:
    branches: ['*']
  pull_request:
    branches: [main, master]

jobs:
  validate-html:
    name: Validate HTML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required files exist
        run: |
          echo "Checking required files..."
          test -f choose-your-fighter/index.html && echo "PASS: index.html"
          test -f choose-your-fighter/cheatsheet.html && echo "PASS: cheatsheet.html"
          for i in $(seq -w 0 15); do
            test -f "choose-your-fighter/images/type-${i}.png" && echo "PASS: type-${i}.png"
          done
          echo "All required files exist."

      - name: Validate HTML structure
        run: |
          for FILE in choose-your-fighter/index.html choose-your-fighter/cheatsheet.html; do
            echo "Validating $FILE..."
            grep -q '<!DOCTYPE html>' "$FILE" && echo "  PASS: DOCTYPE" || { echo "FAIL: missing DOCTYPE in $FILE"; exit 1; }
            grep -q '<html' "$FILE" && echo "  PASS: <html>" || { echo "FAIL: missing <html> in $FILE"; exit 1; }
            grep -q '</html>' "$FILE" && echo "  PASS: </html>" || { echo "FAIL: missing </html> in $FILE"; exit 1; }
            grep -q '<head>' "$FILE" && echo "  PASS: <head>" || { echo "FAIL: missing <head> in $FILE"; exit 1; }
            grep -q '<body>' "$FILE" && echo "  PASS: <body>" || { echo "FAIL: missing <body> in $FILE"; exit 1; }
            grep -q '<title>' "$FILE" && echo "  PASS: <title>" || { echo "FAIL: missing <title> in $FILE"; exit 1; }
            grep -q 'meta.*viewport' "$FILE" && echo "  PASS: viewport" || { echo "FAIL: missing viewport in $FILE"; exit 1; }
          done
          echo "All HTML checks passed."

  verify-distribution:
    name: Verify Quiz Distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run distribution verification
        run: python verify_distribution.py

  test-quiz-logic:
    name: Test Quiz Logic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run quiz logic tests
        run: node test_quiz.mjs
